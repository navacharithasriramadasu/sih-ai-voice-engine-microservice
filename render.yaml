services:
  - type: web
    name: agriconnect-voice-ai
    env: python
    region: singapore
    plan: free
    buildCommand: "wget https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip && unzip -o vosk-model-small-en-us-0.15.zip && mv vosk-model-small-en-us-0.15 model && rm vosk-model-small-en-us-0.15.zip && pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NESTJS_BACKEND_URL
        # Ensure you update this to the actual Render URL of the NestJS backend!
        value: "https://your-nestjs-backend.onrender.com"
